<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bedrock Trade Table Editor</title>
<style>
:root{--bg:#0b1017;--panel:#121923;--panel2:#182230;--line:#2b394b;--text:#edf5ff;--muted:#8fa1b5;--blue:#58d4ff;--violet:#8877ff;--red:#ff7180;--green:#55d39b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1a2a3a 0,#0b1017 42%);color:var(--text);font:14px Inter,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-rows:70px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#0b1017e8;backdrop-filter:blur(14px)}.brand{display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border:1px solid #3c5870;border-radius:11px;display:grid;place-items:center;font-weight:900;color:var(--blue);background:#111a24}.brand h1{margin:0;font-size:17px}.brand small{color:var(--muted)}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#141d28;color:var(--text);border-radius:9px;padding:9px 12px;font-weight:750}.btn:hover{background:#1b2734;border-color:#42627e}.primary{border:0;background:linear-gradient(135deg,#22bddf,#776aff)}.danger{color:#ffadb7}.layout{display:grid;grid-template-columns:260px minmax(500px,1fr) 390px;min-height:0}.side,.main,.json{overflow:auto}.side{padding:15px;border-right:1px solid var(--line);background:#0e141c}.main{padding:20px}.json{border-left:1px solid var(--line);background:#090e14;display:flex;flex-direction:column}.search,input,select,textarea{background:#0e151e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px}.search{width:100%;margin-bottom:12px}.tier{padding:10px;border:1px solid transparent;border-radius:9px;margin-bottom:5px;cursor:pointer}.tier:hover{background:#15202c}.tier.active{background:#162a38;border-color:#37627c}.tier small,.muted{color:var(--muted)}.section{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#7f94aa;font-weight:900;margin:7px 0 9px}.titlebar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:15px}.titlebar h2{margin:0;font-size:23px}.titlebar p{margin:5px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}label{display:flex;flex-direction:column;gap:5px;color:#a9b7c6;font-size:12px;font-weight:700}.card{background:linear-gradient(180deg,#15202c,#111923);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:13px}.group-head,.trade-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.trade{border:1px solid #2a394b;border-radius:11px;padding:12px;background:#0f1720;margin-top:10px}.item{display:grid;grid-template-columns:1fr 130px 130px 36px;gap:8px;margin-top:8px}.item.give{grid-template-columns:1fr 130px 36px}.icon{width:34px;height:34px;background:#101720;color:#cad7e4;border:1px solid var(--line);border-radius:8px}.summary{margin:10px 0;padding:10px;border:1px solid #2a394b;border-radius:9px;background:#0e151e;display:flex;justify-content:space-between;gap:10px;align-items:center}.arrow{font-size:22px;color:var(--blue)}.badge{border:1px solid #2f455a;background:#172535;padding:4px 7px;border-radius:999px;font-size:11px;color:#b4cadc}.jsonhead{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.jsonout{flex:1;margin:0;padding:13px;white-space:pre-wrap;color:#c5efff;overflow:auto;font:12px ui-monospace,Consolas,monospace}.status{padding:8px 13px;border-top:1px solid var(--line);color:var(--green);font-size:12px}.status.err{color:var(--red)}.hidden{display:none}.hr{height:1px;background:var(--line);margin:15px 0}.smallbtn{padding:7px 9px}.toprow{display:flex;gap:7px;flex-wrap:wrap}.drop{border:1px dashed #38506a;border-radius:10px;padding:15px;text-align:center;color:var(--muted);margin-bottom:12px}.code{font-family:ui-monospace,Consolas,monospace}
@media(max-width:1150px){.layout{grid-template-columns:230px 1fr}.json{display:none}}@media(max-width:700px){.layout{display:block}.side{border-right:0;border-bottom:1px solid var(--line)}.main{padding:12px}.grid,.grid3,.item,.item.give{grid-template-columns:1fr}.actions{display:none}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">TT</div><div><h1>Bedrock Trade Table Editor</h1><small>Visual editor for Minecraft Bedrock trade tables</small></div></div><div class="actions"><button class="btn" id="new">New</button><button class="btn" id="sample">Sample</button><button class="btn" id="import">Import JSON</button><button class="btn primary" id="export">Export JSON</button><input type="file" id="file" accept=".json,application/json" hidden></div></header>
<div class="layout"><aside class="side"><div class="section">Tiers</div><input id="search" class="search" placeholder="Search tier..."><div id="nav"></div><button class="btn" style="width:100%" id="addTier">+ Add Tier</button><div class="hr"></div><div class="muted">Supported core structure:</div><div class="muted code" style="margin-top:6px">tiers → groups → trades → wants/gives</div></aside>
<main class="main" id="main"></main>
<aside class="json"><div class="jsonhead"><b>Live JSON</b><button class="btn smallbtn" id="copy">Copy</button></div><pre id="jsonout" class="jsonout"></pre><div id="status" class="status">Ready</div></aside></div></div>
<script>
const SAMPLE={tiers:[{total_exp_required:0,groups:[{num_to_select:1,trades:[{wants:[{item:'minecraft:emerald',quantity:3,price_multiplier:0.05}],gives:[{item:'minecraft:bread',quantity:6}],max_uses:12,trader_exp:2,reward_exp:true},{wants:[{item:'minecraft:emerald',quantity:5,price_multiplier:0.05}],gives:[{item:'minecraft:iron_ingot',quantity:8}],max_uses:12,trader_exp:3,reward_exp:true}]}]},{total_exp_required:10,groups:[{num_to_select:1,trades:[{wants:[{item:'minecraft:emerald',quantity:8,price_multiplier:0.05}],gives:[{item:'minecraft:diamond',quantity:1}],max_uses:8,trader_exp:10,reward_exp:true}]}]}]};
let data=structuredClone(SAMPLE),ti=0,gi=0,ri=0;const $=s=>document.querySelector(s), clone=x=>structuredClone(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tier=()=>data.tiers[ti], group=()=>tier().groups[gi], trade=()=>group().trades[ri];
function newTrade(){return {wants:[{item:'minecraft:emerald',quantity:1,price_multiplier:0.05}],gives:[{item:'minecraft:stone',quantity:1}],max_uses:12,trader_exp:1,reward_exp:true}}
function newGroup(){return {num_to_select:1,trades:[newTrade()]}} function newTier(){return {total_exp_required:0,groups:[newGroup()]}}
function normalize(x){if(Array.isArray(x))return {tiers:x};if(x?.['minecraft:trade_table'])return normalize(x['minecraft:trade_table']);if(!Array.isArray(x?.tiers))throw Error('No tiers array found');x.tiers=x.tiers.map(t=>{if(!Array.isArray(t.groups)&&Array.isArray(t.trades)){let{trades,...rest}=t;return {...rest,groups:[{num_to_select:trades.length,trades}]}}return t});return x;}
function validate(){try{if(!Array.isArray(data.tiers))throw Error('tiers must be an array');data.tiers.forEach((t,a)=>{if(!Array.isArray(t.groups))throw Error('Tier '+(a+1)+' needs groups');t.groups.forEach((g,b)=>{if(!Array.isArray(g.trades))throw Error('Group '+(b+1)+' needs trades');if(!g.trades.length)throw Error('Tier '+(a+1)+', Group '+(b+1)+' has no trades');g.trades.forEach((r,c)=>{if(!r.wants?.length)throw Error(Tier ${a+1}, Group ${b+1}, Trade ${c+1}: wants missing);if(!r.gives?.length)throw Error(Tier ${a+1}, Group ${b+1}, Trade ${c+1}: gives missing);})})});setStatus('Valid ✓');return true}catch(e){setStatus(e.message,true);return false}}
function setStatus(s,err=false){$('#status').textContent=s;$('#status').className='status'+(err?' err':'')}
function setPath(path,val){let o=data;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=val}
function itemRow(it,path,kind){let q=it.quantity, range=q&&typeof q==='object';return <div class="item ${kind==='give'?'give':''}"><label>Item ID<input data-act="item" data-path='${JSON.stringify(path)}' value="${esc(it.item||'')}"></label><label>Quantity<select data-act="mode" data-path='${JSON.stringify(path)}'><option value="fixed" ${range?'':'selected'}>Fixed</option><option value="range" ${range?'selected':''}>Range</option></select>${range?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px"><input type="number" min="1" data-act="min" data-path='${JSON.stringify(path)}' value="${q.min}"><input type="number" min="1" data-act="max" data-path='${JSON.stringify(path)}' value="${q.max}"></div>:`<input type="number" min="1" data-act="qty" data-path='${JSON.stringify(path)}' value="${q||1}">`}</label>${kind==='want'?`<label>Price Multiplier<input type="number" step="0.01" data-act="price" data-path='${JSON.stringify(path)}' value="${it.price_multiplier??0}"></label>`:''}<button class="icon" data-act="delitem" data-path='${JSON.stringify(path)}'>×</button></div>`}
function tradeHtml(t,g,r){let p=['tiers',ti,'groups',g,'trades',r],sum=[...(t.wants||[]).map(x=>`${x.quantity||1}× ${x.item||'?'}`),'→',...(t.gives||[]).map(x=>`${x.quantity||1}× ${x.item||'?'}`)].join(' ');return `<div class="trade"><div class="trade-head"><div><b>Trade ${r+1}</b><div class="muted">${esc(sum)}</div></div><button class="icon" data-act="deltrade" data-path='${JSON.stringify(p)}'>×</button></div><div class="summary"><span>${t.wants.length} want(s)</span><span class="arrow">→</span><span>${t.gives.length} give(s)</span><span class="badge">${t.max_uses??12} uses</span></div><div class="section">Wants — player pays</div>${t.wants.map((x,i)=>itemRow(x,[...p,'wants',i],'want')).join('')}<button class="btn smallbtn" data-act="addwant" data-path='${JSON.stringify(p)}'>+ Add Want</button><div class="section" style="margin-top:14px">Gives — trader pays</div>${t.gives.map((x,i)=>itemRow(x,[...p,'gives',i],'give')).join('')}<button class="btn smallbtn" data-act="addgive" data-path='${JSON.stringify(p)}'>+ Add Give</button><div class="hr"></div><div class="grid3"><label>Max Uses<input type="number" min="1" data-act="tf" data-key="max_uses" data-path='${JSON.stringify(p)}' value="${t.max_uses??12}"></label><label>Trader XP<input type="number" min="0" data-act="tf" data-key="trader_exp" data-path='${JSON.stringify(p)}' value="${t.trader_exp??1}"></label><label>Reward XP <input type="checkbox" data-act="tfbool" data-key="reward_exp" data-path='${JSON.stringify(p)}' ${t.reward_exp!==false?'checked':''}></label></div><details style="margin-top:10px"><summary class="muted">Raw trade JSON</summary><textarea style="margin-top:8px;min-height:130px;width:100%" data-act="raw" data-path='${JSON.stringify(p)}'>${esc(JSON.stringify(t,null,2))}</textarea></details></div>`}
function render(){if(ti>=data.tiers.length)ti=Math.max(0,data.tiers.length-1);if(!data.tiers.length){data.tiers=[newTier()];ti=0}if(!tier().groups?.length)tier().groups=[newGroup()];tier().groups.forEach(g=>{if(!g.trades?.length)g.trades=[newTrade()]});if(gi>=tier().groups.length)gi=tier().groups.length-1;if(ri>=group().trades.length)ri=group().trades.length-1;let q=($('#search').value||'').toLowerCase();$('#nav').innerHTML=data.tiers.map((x,i)=>{let s=`Tier ${i+1} ${x.total_exp_required??0}`.toLowerCase();if(q&&!s.includes(q))return '';let c=(x.groups||[]).reduce((n,g)=>n+(g.trades||[]).length,0);return <div class="tier ${i===ti?'active':''}" data-tier="${i}"><b>Tier ${i+1}</b><small>${x.total_exp_required??0} XP · ${c} trades</small></div>`}).join('');let t=tier();$('#main').innerHTML=`<div class="titlebar"><div><h2>Tier ${ti+1}</h2><p>Configure level requirements, groups and trades.</p></div><div class="toprow"><button class="btn" id="dup">Duplicate</button><button class="btn danger" id="delt">Delete</button></div></div><div class="card"><div class="grid"><label>Total XP Required<input type="number" min="0" id="tierxp" value="${t.total_exp_required??0}"></label><label>Location in JSON<input value="tiers[${ti}]" disabled></label></div></div><div class="toprow" style="margin:8px 0 12px"><div class="section" style="margin:7px 0">Groups</div><button class="btn smallbtn" id="addgroup">+ Add Group</button></div>${t.groups.map((g,idx)=>`<div class="card"><div class="group-head"><div><b>Group ${idx+1}</b><div class="muted">${g.trades.length} trade(s) · select ${g.num_to_select??1}</div></div><button class="icon" data-act="delgroup" data-i="${idx}">×</button></div><div class="grid" style="margin-top:10px"><label>Number to Select<input type="number" min="1" data-act="groupcount" data-i="${idx}" value="${g.num_to_select??1}"></label><label>Selection mode<select disabled><option>Random from group</option></select></label></div>${g.trades.map((r,j)=>tradeHtml(r,idx,j)).join('')}<button class="btn smallbtn" style="margin-top:10px" data-act="addtrade" data-i="${idx}">+ Add Trade</button></div>).join('')}`;$('#jsonout').textContent=JSON.stringify(data,null,2);validate()}
function refresh(){render()}

document.addEventListener('click',e=>{let t=e.target.closest('[data-tier]');if(t){ti=+t.dataset.tier;gi=ri=0;render();return}let a=e.target.closest('[data-act]');if(!a)return;let act=a.dataset.act,p=JSON.parse(a.dataset.path||'[]');if(act==='addwant'){let o=data;for(let x of p)o=o[x];o.wants.push({item:'minecraft:emerald',quantity:1,price_multiplier:.05});refresh()}else if(act==='addgive'){let o=data;for(let x of p)o=o[x];o.gives.push({item:'minecraft:stone',quantity:1});refresh()}else if(act==='delitem'){let o=data;for(let i=0;i<p.length-1;i++)o=o[p[i]];o.splice(p[p.length-1],1);refresh()}else if(act==='deltrade'){let o=data;for(let i=0;i<p.length-1;i++)o=o[p[i]];o.splice(p[p.length-1],1);refresh()}else if(act==='addtrade'){data.tiers[ti].groups[+a.dataset.i].trades.push(newTrade());refresh()}else if(act==='delgroup'){data.tiers[ti].groups.splice(+a.dataset.i,1);if(!data.tiers[ti].groups.length)data.tiers[ti].groups.push(newGroup());refresh()} });
document.addEventListener('change',e=>{let a=e.target.closest('[data-act="mode"]');if(!a)return;let p=JSON.parse(a.dataset.path||'[]');let o=data;for(let x of p)o=o[x];o.quantity=a.value==='range'?{min:1,max:1}:1;refresh()});
document.addEventListener('input',e=>{let a=e.target.closest('[data-act]');if(!a)return;let act=a.dataset.act,p=JSON.parse(a.dataset.path||'[]');let o=data;for(let x of p)o=o[x];if(act==='item'){o.item=e.target.value;refreshJson()}else if(act==='qty'){o.quantity=Math.max(1,+e.target.value||1);refreshJson()}else if(act==='min'){o.quantity={min:Math.max(1,+e.target.value||1),max:o.quantity.max};refreshJson()}else if(act==='max'){o.quantity={min:o.quantity.min,max:Math.max(o.quantity.min,+e.target.value||1)};refreshJson()}else if(act==='price'){o.price_multiplier=+e.target.value||0;refreshJson()}else if(act==='tf'){o[a.dataset.key]=Math.max(0,+e.target.value||0);refreshJson()}else if(act==='tfbool'){o[a.dataset.key]=e.target.checked;refreshJson()}else if(act==='raw'){try{let parsed=JSON.parse(e.target.value);Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,parsed);refreshJson()}catch{setStatus('Raw trade JSON is invalid',true)}}else if(act==='groupcount'){data.tiers[ti].groups[+a.dataset.i].num_to_select=Math.max(1,+e.target.value||1);refreshJson()}});
function refreshJson(){$('#jsonout').textContent=JSON.stringify(data,null,2);validate()}
$('#tierxp').oninput=e=>{data.tiers[ti].total_exp_required=Math.max(0,+e.target.value||0);refreshJson()};$('#addgroup').onclick=()=>{data.tiers[ti].groups.push(newGroup());render()};$('#dup').onclick=()=>{data.tiers.splice(ti+1,0,clone(data.tiers[ti]));ti++;render()};$('#delt').onclick=()=>{if(data.tiers.length===1)return;data.tiers.splice(ti,1);ti=Math.min(ti,data.tiers.length-1);render()};$('#addTier').onclick=()=>{data.tiers.push(newTier());ti=data.tiers.length-1;gi=ri=0;render()};$('#search').oninput=render;
$('#new').onclick=()=>{data={tiers:[newTier()]};ti=gi=ri=0;render()};$('#sample').onclick=()=>{data=clone(SAMPLE);ti=gi=ri=0;render()};$('#import').onclick=()=>$('#file').click();$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=normalize(JSON.parse(r.result));ti=gi=ri=0;render();setStatus('Imported successfully')}catch(err){setStatus(err.message,true)}};r.readAsText(f);e.target.value=''};$('#export').onclick=()=>{if(!validate())return;let b=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='trades.json';a.click();URL.revokeObjectURL(a.href);setStatus('Exported trades.json')};$('#copy').onclick=()=>navigator.clipboard?.writeText(JSON.stringify(data,null,2)).then(()=>setStatus('JSON copied'));
render();
</script></body></html>
