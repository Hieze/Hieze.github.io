<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>12 Thì Tiếng Anh – 6.000 Level</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
    <style>
        :root {
            --p: #6C63FF;
            --s: #FFB84C;
            --ok: #45C486;
            --bad: #e5484d;
            --bg: #F7F8FC;
            --tx: #252A41;
            --card: #fff;
            --mu: #6b7194;
            --bd: #e6e8f2;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #171a2b;
                --tx: #eef0ff;
                --card: #222640;
                --mu: #a3a8c8;
                --bd: #363b66;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #171a2b;
            --tx: #eef0ff;
            --card: #222640;
            --mu: #a3a8c8;
            --bd: #363b66;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 16px/1.55 "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--tx)
        }

        nav {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            padding: 10px 16px;
            background: var(--card);
            border-bottom: 1px solid var(--bd);
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 5
        }

        nav b {
            margin-right: auto;
            color: var(--p);
            font-size: 1.1rem
        }

        nav button {
            border: 0;
            background: none;
            color: var(--tx);
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font: inherit;
            font-weight: 600
        }

        nav button:hover,
        nav button:focus-visible {
            background: var(--bg)
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px
        }

        h2 {
            margin: .6em 0 .3em
        }

        h3 {
            margin: .2em 0
        }

        .btn {
            background: var(--p);
            color: #fff;
            border: 0;
            border-radius: 14px;
            padding: 12px 22px;
            font: inherit;
            font-weight: 800;
            cursor: pointer
        }

        .btn.sm {
            padding: 7px 14px;
            margin-top: 8px;
            background: var(--c)
        }

        .btn:focus-visible,
        .opt:focus-visible,
        .nd:focus-visible,
        .chip:focus-visible {
            outline: 3px solid var(--s);
            outline-offset: 2px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-top: 6px solid var(--c, var(--p));
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 4px 14px rgba(60, 60, 120, .08);
            cursor: pointer;
            transition: transform .15s
        }

        .card:hover {
            transform: translateY(-3px)
        }

        .grid3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin: 14px 0
        }

        .grid2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 14px;
            margin: 14px 0
        }

        .bar {
            height: 10px;
            background: var(--bd);
            border-radius: 9px;
            overflow: hidden;
            margin: 8px 0
        }

        .bar i {
            display: block;
            height: 100%;
            border-radius: 9px;
            transition: width .4s
        }

        .hero {
            display: flex;
            gap: 18px;
            align-items: center;
            background: linear-gradient(135deg, var(--p), #8f89ff);
            color: #fff;
            border-radius: 24px;
            padding: 24px;
            flex-wrap: wrap
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
            line-height: 1.2
        }

        .hero p {
            margin: 0 0 14px
        }

        .hero .btn {
            background: var(--s);
            color: #252A41
        }

        .mas {
            font-size: 4.5rem
        }

        .ic {
            font-size: 2rem
        }

        .en,
        .mu,
        small {
            color: var(--mu)
        }

        code {
            display: block;
            background: var(--bg);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: .85rem;
            margin: 6px 0;
            white-space: normal
        }

        .map {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
            gap: 10px;
            padding: 14px;
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--bd)
        }

        .nd {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid var(--bd);
            background: var(--bg);
            color: var(--tx);
            font: inherit;
            font-weight: 800;
            cursor: pointer
        }

        .nd:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .nd.dn {
            background: var(--ok);
            border-color: var(--ok);
            color: #fff
        }

        .nd.cur {
            background: var(--c);
            border-color: var(--s);
            color: #fff;
            animation: pl 1.4s infinite
        }

        .nd.bs {
            border-color: var(--s)
        }

        @keyframes pl {
            50% {
                box-shadow: 0 0 0 8px rgba(108, 99, 255, .22)
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .nd.cur {
                animation: none
            }

            .card {
                transition: none
            }
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 10px 0
        }

        .tabs button {
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
            font: inherit
        }

        .tabs .on {
            background: var(--p);
            color: #fff;
            border-color: var(--p)
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            margin: 8px 0;
            padding: 12px 14px;
            border-radius: 14px;
            border: 2px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            font: inherit;
            cursor: pointer
        }

        .opt.sel {
            border-color: var(--p)
        }

        .opt.ok {
            border-color: var(--ok);
            background: rgba(69, 196, 134, .18)
        }

        .opt.no {
            border-color: var(--bad)
        }

        .inp {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 2px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            font: inherit
        }

        .chip {
            display: inline-block;
            margin: 4px;
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--card);
            border: 2px solid var(--bd);
            color: var(--tx);
            font: inherit;
            cursor: pointer
        }

        .ans {
            min-height: 56px;
            border-bottom: 2px dashed var(--bd);
            margin-bottom: 8px
        }

        .fb {
            margin: 12px 0;
            padding: 12px 14px;
            border-radius: 14px;
            background: var(--card);
            border-left: 6px solid var(--ok)
        }

        .fb.no {
            border-color: var(--bad)
        }

        .big {
            font-size: 1.15rem;
            font-weight: 700
        }

        body {
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(900px 420px at 6% -4%, rgba(108, 99, 255, .18), transparent 60%), radial-gradient(700px 380px at 100% 0, rgba(255, 184, 76, .2), transparent 60%), var(--bg);
            background-attachment: fixed
        }

        h1,
        h2,
        h3,
        .btn,
        .logo,
        .nd,
        .tile b {
            font-family: 'Baloo 2', 'Nunito', sans-serif
        }

        h2 {
            font-size: 1.7rem
        }

        main {
            max-width: 1000px;
            padding: 20px 16px 44px
        }

        nav {
            background: color-mix(in srgb, var(--card) 82%, transparent);
            backdrop-filter: blur(14px);
            border-bottom: 0;
            box-shadow: 0 1px 0 var(--bd)
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--tx)
        }

        .logo span {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--p), var(--pl));
            box-shadow: 0 4px 0 var(--pd, #4a42cf);
            font-size: 1.1rem
        }

        nav button {
            border-radius: 999px
        }

        nav button.on {
            background: var(--p);
            color: #fff
        }

        nav button.support {
            color: #fff;
            background: linear-gradient(135deg, #e84d8a, #7c4dff 54%, #14b8a6);
            box-shadow: 0 4px 14px -5px rgba(153, 62, 208, .85);
            font-weight: 800;
            animation: support-glow 2.8s ease-in-out infinite
        }

        @keyframes support-glow {
            50% {
                box-shadow: 0 5px 20px -3px rgba(232, 77, 138, .9), 0 0 0 4px rgba(124, 77, 255, .1)
            }
        }

        .btn {
            border-radius: 16px;
            box-shadow: 0 5px 0 var(--pd, #4a42cf);
            transition: transform .1s, box-shadow .1s
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--pd, #4a42cf)
        }

        .card {
            border: 0;
            border-radius: 26px;
            box-shadow: 0 10px 30px -14px rgba(76, 64, 200, .4)
        }

        .hero {
            position: relative;
            overflow: hidden;
            flex-wrap: nowrap;
            justify-content: space-between;
            border-radius: 32px;
            padding: 34px 32px;
            background: radial-gradient(circle at 88% 18%, rgba(255, 184, 76, .5), transparent 36%), linear-gradient(135deg, var(--pd), var(--p) 60%, var(--pl));
            box-shadow: 0 24px 44px -22px rgba(90, 80, 240, .75)
        }

        .hero::before,
        .hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1)
        }

        .hero::before {
            width: 230px;
            height: 230px;
            left: -70px;
            bottom: -100px
        }

        .hero::after {
            width: 120px;
            height: 120px;
            right: 32%;
            top: -46px
        }

        .ht {
            position: relative;
            z-index: 1;
            max-width: 520px
        }

        .hero h1 {
            font-size: clamp(1.7rem, 4.6vw, 2.7rem);
            font-weight: 800;
            line-height: 1.12
        }

        .hero p {
            font-size: 1.05rem
        }

        .btn.go {
            background: var(--s);
            color: #2b2340;
            font-size: 1.1rem;
            padding: 14px 32px;
            border-radius: 18px;
            box-shadow: 0 6px 0 #d98f1f
        }

        .btn.go:active {
            box-shadow: 0 2px 0 #d98f1f
        }

        .mw {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        .mw svg {
            width: 172px;
            animation: fl 4s ease-in-out infinite;
            filter: drop-shadow(0 14px 14px rgba(0, 0, 0, .22))
        }

        @keyframes fl {
            50% {
                transform: translateY(-10px)
            }
        }

        .say {
            position: relative;
            margin-top: 8px;
            max-width: 190px;
            padding: 8px 14px;
            border-radius: 16px;
            background: #fff;
            color: #2b2340;
            font-weight: 800;
            font-size: .9rem;
            text-align: center
        }

        .say::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            margin-left: -6px;
            width: 12px;
            height: 12px;
            background: #fff;
            transform: rotate(45deg)
        }

        @media(max-width:640px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 26px 18px
            }

            .mw svg {
                width: 130px
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 18px 0
        }

        .tile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--bd)
        }

        .tile i {
            font-style: normal;
            font-size: 1.6rem;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--bg)
        }

        .tile b {
            display: block;
            font-size: 1.55rem;
            line-height: 1.05
        }

        .tile span {
            font-size: .85rem;
            color: var(--mu)
        }

        .ring {
            width: 44px;
            height: 44px;
            flex: none
        }

        .gc {
            position: relative;
            overflow: hidden;
            padding: 22px;
            color: #fff;
            background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 68%, #000));
            box-shadow: 0 18px 30px -16px var(--c)
        }

        .gc::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            right: -44px;
            top: -44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .14)
        }

        .gc .ic {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            margin-bottom: 8px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .22);
            font-size: 1.9rem
        }

        .gc h3 {
            font-size: 1.3rem
        }

        .gc p {
            margin: .3em 0 .8em
        }

        .gc small {
            color: rgba(255, 255, 255, .88)
        }

        .gc .bar {
            background: rgba(255, 255, 255, .28)
        }

        .gc .bar i {
            background: #fff !important
        }

        .gc .btn.sm {
            background: #fff;
            color: #2b2340;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .2)
        }

        .grid2 .card {
            border-left: 8px solid var(--c);
            padding: 18px 20px
        }

        .grid2 code {
            background: color-mix(in srgb, var(--c) 12%, var(--card));
            font-weight: 700;
            border-radius: 10px
        }

        .bar {
            height: 14px
        }

        .bar i {
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12)
        }

        .tabs button {
            border-radius: 999px;
            font-weight: 700
        }

        .tabs .on {
            box-shadow: 0 4px 0 var(--pd, #4a42cf)
        }

        .map {
            --w: clamp(46px, 13vw, 62px);
            display: block;
            padding: 20px 14px;
            border: 0;
            border-radius: 28px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--c) 11%, var(--card)), var(--card));
            box-shadow: 0 14px 34px -18px var(--c)
        }

        .row {
            position: relative;
            display: flex;
            justify-content: space-between;
            padding: 14px 0
        }

        .row::before {
            content: '';
            position: absolute;
            left: calc(var(--w)/2);
            right: calc(var(--w)/2);
            top: 50%;
            height: 10px;
            margin-top: -5px;
            border-radius: 6px;
            background: repeating-linear-gradient(90deg, var(--bd) 0 14px, transparent 14px 24px)
        }

        .row:not(:last-child)::after {
            content: '';
            position: absolute;
            right: calc(var(--w)/2 - 5px);
            width: 10px;
            top: 50%;
            height: 100%;
            border-radius: 6px;
            background: repeating-linear-gradient(180deg, var(--bd) 0 14px, transparent 14px 24px)
        }

        .row.r:not(:last-child)::after {
            right: auto;
            left: calc(var(--w)/2 - 5px)
        }

        .nd {
            position: relative;
            z-index: 1;
            width: var(--w);
            border: 0;
            font-size: 1.15rem;
            background: var(--card);
            color: var(--mu);
            box-shadow: 0 6px 0 var(--bd), inset 0 0 0 3px var(--bd)
        }

        .nd:disabled {
            opacity: .55
        }

        .nd:active:not(:disabled) {
            transform: translateY(4px)
        }

        .nd.dn {
            background: linear-gradient(160deg, #6fe6ae, var(--ok));
            color: #fff;
            box-shadow: 0 6px 0 #2e9c69
        }

        .nd.cur {
            background: linear-gradient(160deg, var(--pl), var(--p));
            color: #fff;
            box-shadow: 0 6px 0 var(--pd, #4a42cf);
            animation: pl 1.6s infinite
        }

        .nd.bs {
            background: linear-gradient(160deg, #ffd27a, var(--s));
            color: #5b3a00;
            box-shadow: 0 6px 0 #d98f1f
        }

        .nd.bs:disabled {
            filter: grayscale(.6)
        }

        @keyframes pl {
            50% {
                box-shadow: 0 6px 0 var(--pd, #4a42cf), 0 0 0 12px rgba(108, 99, 255, .18)
            }
        }

        #app h3 {
            font-size: 1.3rem
        }

        .big {
            font-size: 1.4rem;
            padding: 16px 18px;
            border-radius: 18px;
            background: var(--card)
        }

        .opt {
            padding: 14px 18px;
            border-radius: 18px;
            font-weight: 700;
            box-shadow: 0 4px 0 var(--bd);
            transition: transform .1s, border-color .15s
        }

        .opt:hover:not(:disabled) {
            border-color: var(--p);
            transform: translateY(-1px)
        }

        .opt.sel {
            background: color-mix(in srgb, var(--p) 10%, var(--card));
            box-shadow: 0 4px 0 var(--p)
        }

        .opt.ok {
            box-shadow: 0 4px 0 var(--ok)
        }

        .opt.no {
            background: rgba(229, 72, 77, .12);
            box-shadow: 0 4px 0 var(--bad)
        }

        .inp {
            padding: 14px 16px;
            font-size: 1.1rem;
            border-radius: 16px
        }

        .inp:focus {
            outline: 0;
            border-color: var(--p);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, .2)
        }

        .chip {
            border-radius: 14px;
            font-weight: 700;
            box-shadow: 0 3px 0 var(--bd)
        }

        .ans {
            padding: 8px;
            border: 2px dashed var(--bd);
            border-radius: 16px;
            background: var(--card)
        }

        .fb {
            border: 2px solid var(--ok);
            border-radius: 18px;
            background: rgba(69, 196, 134, .14)
        }

        .fb.no {
            border-color: var(--bad);
            background: rgba(229, 72, 77, .1)
        }

        .tutor {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding: 12px;
            border-radius: 14px;
            background: var(--card);
            font-size: .95rem
        }

        .tutor span {
            font-size: 1.6rem
        }

        .res {
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 32px 20px
        }

        .cf {
            position: absolute;
            top: -14px;
            left: var(--x);
            width: 9px;
            height: 14px;
            border-radius: 2px;
            background: var(--k);
            animation: fall 1.8s var(--d) ease-in forwards
        }

        @keyframes fall {
            to {
                transform: translateY(420px) rotate(540deg);
                opacity: 0
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .mw svg,
            .nd.cur {
                animation: none
            }

            .cf {
                display: none
            }
        }

        nav #who {
            display: flex;
            align-items: center;
            gap: 6px
        }

        nav #who .nick {
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--bg)
        }

        nav #who .nick em {
            font-style: normal;
            font-size: .72rem;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 6px;
            background: linear-gradient(135deg, #FFB84C, #ff8b4c);
            color: #2b2340
        }

        nav.lo button,
        nav.lo #who {
            display: none
        }

        .chip:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .login {
            max-width: 460px;
            margin: 28px auto;
            padding: 30px 22px;
            text-align: center;
            cursor: default
        }

        .login:hover {
            transform: none
        }

        .login .mw svg {
            width: 116px
        }

        .login p {
            margin: .3em 0 1em
        }

        .login .inp {
            text-align: center;
            font-weight: 700
        }

        .login .btn.go {
            width: 100%;
            margin-top: 6px
        }

        .err {
            min-height: 1.5em;
            margin: 8px 0 4px;
            color: var(--bad);
            font-weight: 700
        }

        .recent {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--bd)
        }

        .god {
            --c: #FFB84C;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            align-items: center;
            padding: 14px 18px;
            margin: 14px 0;
            border-radius: 22px;
            color: #fff;
            background: linear-gradient(135deg, #2b2340, #4a3a8a);
            box-shadow: 0 14px 28px -16px #4a3a8a
        }

        .god label {
            display: flex;

        function copyCloudRules() { const text = cloudRulesText(); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => notify("Đã sao chép Firestore Rules.", "success"), () => notify("Không thể sao chép. Hãy chọn và sao chép nội dung trong khung.", "error")); else notify("Hãy chọn và sao chép nội dung trong khung Rules.", "error") }
        const DS = { c: "#6C63FF", m: "auto", style: "classic", sfx: 1, sv: .7, mus: 1, mv: .12 };

        }
        let AC = null, MG, SG, mcur = "", mstep = 0, nextT = 0;

        function vol() { if (AC) { MG.gain.value = ST.mus ? ST.mv : 0; SG.gain.value = ST.sfx ? ST.sv : 0 } const audio = $("ta-audio"); if (audio) audio.volume = ST.mus ? ST.mv : 0 }
        const hz = m => 440 * Math.pow(2, (m - 69) / 12);
        function tone(f, t0, d, w, g, out) { const o = AC.createOscillator(), e = AC.createGain(); o.type = w; o.frequency.value = f; e.gain.setValueAtTime(.0001, t0); e.gain.exponentialRampToValueAtTime(g, t0 + .015); e.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(e); e.connect(out); o.start(t0); o.stop(t0 + d + .05) }

        const TRK = {
            home: { b: 92, w: "triangle", ch: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], pt: [0, 1, 2, 1, 0, 1, 2, 1] },
            study: { b: 76, w: "sine", ch: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], pt: [0, 2, 1, 2, 0, 2, 1, 2] },
            mt: { b: 126, w: "square", q: .3, ch: [[67, 71, 74], [64, 67, 71], [60, 64, 67], [62, 66, 69]], pt: [0, 2, 1, 2, 0, 2, 1, 2] },
            trf: { b: 88, w: "triangle", ch: [[62, 65, 69], [58, 62, 65], [55, 58, 62], [57, 61, 64]], pt: [0, 1, 2, 1, 2, 1, 0, 1] },

        function sync() { if (!ST.mus) { mcur = ""; return } const w = trackFor(); if (!w) { mcur = ""; return } if (AC && AC.state == "running" && mcur != w) { mcur = w; mstep = 0; nextT = AC.currentTime + .15 } }
        function mtick() { if (!AC || !mcur || !ST.mus || AC.state != "running") return; const T = TRK[mcur]; while (nextT < AC.currentTime + .3) { const e = 30 / (T.b * (mcur == "ta" && ta.on ? 1 + (60 - taLeft()) / 60 * .3 : 1)), c = T.ch[Math.floor(mstep / T.pt.length) % T.ch.length], n = c[T.pt[mstep % T.pt.length]] + (mstep % 8 == 7 ? 12 : 0); tone(hz(n), nextT, e * 1.8, T.w, (T.q || .22) * .5, MG); if (mstep % 4 == 0) tone(hz(c[0] - 24), nextT, e * 3.6, "sine", .3, MG); if (T.k && mstep % 2 == 1) tone(hz(c[0] + 24), nextT, e * .6, "square", .06, MG); nextT += e; mstep++ } }
