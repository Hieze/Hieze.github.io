<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Học 12 thì tiếng Anh qua 6.000 level: bài học có sơ đồ thời gian, luyện tập, ôn tập ngắt quãng, thử thách hằng ngày và hồ sơ lưu ngay trên máy bạn.">
    <meta name="theme-color" content="#6C63FF">
    <meta name="color-scheme" content="light dark">
    <title>12 Thì Tiếng Anh – 6.000 Level</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
    <style>
        :root {
            --p: #6C63FF;
            --s: #FFB84C;
            --ok: #45C486;
            --bad: #e5484d;
            --bg: #F7F8FC;
            --tx: #252A41;
            --card: #fff;
            --mu: #6b7194;
            --bd: #e6e8f2;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #171a2b;
                --tx: #eef0ff;
                --card: #222640;
                --mu: #a3a8c8;
                --bd: #363b66;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #171a2b;
            --tx: #eef0ff;
            --card: #222640;
            --mu: #a3a8c8;
            --bd: #363b66;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 16px/1.55 "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--tx)
        }


        .nvb-unused {
            margin-right: auto;
            color: var(--p);
            font-size: 1.1rem
        }



        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px
        }

        h2 {
            margin: .6em 0 .3em
        }

        h3 {
            margin: .2em 0
        }

        .btn {
            background: var(--p);
            color: #fff;
            border: 0;
            border-radius: 14px;
            padding: 12px 22px;
            font: inherit;
            font-weight: 800;
            cursor: pointer
        }

        .btn.sm {
            padding: 7px 14px;
            margin-top: 8px;
            background: var(--c)
        }

        .btn:focus-visible,
        .opt:focus-visible,
        .nd:focus-visible,
        .chip:focus-visible {
            outline: 3px solid var(--s);
            outline-offset: 2px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-top: 6px solid var(--c, var(--p));
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 4px 14px rgba(60, 60, 120, .08);
            cursor: pointer;
            transition: transform .15s
        }

        .card:hover {
            transform: translateY(-3px)
        }

        .grid3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin: 14px 0
        }

        .grid2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 14px;
            margin: 14px 0
        }

        .bar {
            height: 10px;
            background: var(--bd);
            border-radius: 9px;
            overflow: hidden;
            margin: 8px 0
        }

        .bar i {
            display: block;
            height: 100%;
            border-radius: 9px;
            transition: width .4s
        }

        .hero {
            display: flex;
            gap: 18px;
            align-items: center;
            background: linear-gradient(135deg, var(--p), #8f89ff);
            color: #fff;
            border-radius: 24px;
            padding: 24px;
            flex-wrap: wrap
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
            line-height: 1.2
        }

        .hero p {
            margin: 0 0 14px
        }

        .hero .btn {
            background: var(--s);
            color: #252A41
        }

        .mas {
            font-size: 4.5rem
        }

        .ic {
            font-size: 2rem
        }

        .en,
        .mu,
        small {
            color: var(--mu)
        }

        code {
            display: block;
            background: var(--bg);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: .85rem;
            margin: 6px 0;
            white-space: normal
        }

        .map {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
            gap: 10px;
            padding: 14px;
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--bd)
        }

        .nd {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid var(--bd);
            background: var(--bg);
            color: var(--tx);
            font: inherit;
            font-weight: 800;
            cursor: pointer
        }

        .nd:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .nd.dn {
            background: var(--ok);
            border-color: var(--ok);
            color: #fff
        }

        .nd.cur {
            background: var(--c);
            border-color: var(--s);
            color: #fff;
            animation: pl 1.4s infinite
        }

        .nd.bs {
            border-color: var(--s)
        }

        @keyframes pl {
            50% {
                box-shadow: 0 0 0 8px rgba(108, 99, 255, .22)
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .nd.cur {
                animation: none
            }

            .card {
                transition: none
            }
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 10px 0
        }

        .tabs button {
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
            font: inherit
        }

        .tabs .on {
            background: var(--p);
            color: #fff;
            border-color: var(--p)
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            margin: 8px 0;
            padding: 12px 14px;
            border-radius: 14px;
            border: 2px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            font: inherit;
            cursor: pointer
        }

        .opt.sel {
            border-color: var(--p)
        }

        .opt.ok {
            border-color: var(--ok);
            background: rgba(69, 196, 134, .18)
        }

        .opt.no {
            border-color: var(--bad)
        }

        .inp {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 2px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            font: inherit
        }

        .chip {
            display: inline-block;
            margin: 4px;
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--card);
            border: 2px solid var(--bd);
            color: var(--tx);
            font: inherit;
            cursor: pointer
        }

        .ans {
            min-height: 56px;
            border-bottom: 2px dashed var(--bd);
            margin-bottom: 8px
        }

        .fb {
            margin: 12px 0;
            padding: 12px 14px;
            border-radius: 14px;
            background: var(--card);
            border-left: 6px solid var(--ok)
        }

        .fb.no {
            border-color: var(--bad)
        }

        .big {
            font-size: 1.15rem;
            font-weight: 700
        }

        body {
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(900px 420px at 6% -4%, rgba(108, 99, 255, .18), transparent 60%), radial-gradient(700px 380px at 100% 0, rgba(255, 184, 76, .2), transparent 60%), var(--bg);
            background-attachment: fixed
        }

        h1,
        h2,
        h3,
        .btn,
        .logo,
        .nd,
        .tile b {
            font-family: 'Baloo 2', 'Nunito', sans-serif
        }

        h2 {
            font-size: 1.7rem
        }

        main {
            max-width: 1000px;
            padding: 20px 16px 44px
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--tx)
        }

        .logo span {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--p), var(--pl));
            box-shadow: 0 4px 0 var(--pd, #4a42cf);
            font-size: 1.1rem
        }




        @keyframes support-glow {
            50% {
                box-shadow: 0 5px 20px -3px rgba(232, 77, 138, .9), 0 0 0 4px rgba(124, 77, 255, .1)
            }
        }

        .btn {
            border-radius: 16px;
            box-shadow: 0 5px 0 var(--pd, #4a42cf);
            transition: transform .1s, box-shadow .1s
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--pd, #4a42cf)
        }

        .card {
            border: 0;
            border-radius: 26px;
            box-shadow: 0 10px 30px -14px rgba(76, 64, 200, .4)
        }

        .hero {
            position: relative;
            overflow: hidden;
            flex-wrap: nowrap;
            justify-content: space-between;
            border-radius: 32px;
            padding: 34px 32px;
            background: radial-gradient(circle at 88% 18%, rgba(255, 184, 76, .5), transparent 36%), linear-gradient(135deg, var(--pd), var(--p) 60%, var(--pl));
            box-shadow: 0 24px 44px -22px rgba(90, 80, 240, .75)
        }

        .hero::before,
        .hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1)
        }

        .hero::before {
            width: 230px;
            height: 230px;
            left: -70px;
            bottom: -100px
        }

        .hero::after {
            width: 120px;
            height: 120px;
            right: 32%;
            top: -46px
        }

        .ht {
            position: relative;
            z-index: 1;
            max-width: 520px
        }

        .hero h1 {
            font-size: clamp(1.7rem, 4.6vw, 2.7rem);
            font-weight: 800;
            line-height: 1.12
        }

        .hero p {
            font-size: 1.05rem
        }

        .btn.go {
            background: var(--s);
            color: #2b2340;
            font-size: 1.1rem;
            padding: 14px 32px;
            border-radius: 18px;
            box-shadow: 0 6px 0 #d98f1f
        }

        .btn.go:active {
            box-shadow: 0 2px 0 #d98f1f
        }

        .mw {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        .mw svg {
            width: 172px;
            animation: fl 4s ease-in-out infinite;
            filter: drop-shadow(0 14px 14px rgba(0, 0, 0, .22))
        }

        @keyframes fl {
            50% {
                transform: translateY(-10px)
            }
        }

        .say {
            position: relative;
            margin-top: 8px;
            max-width: 190px;
            padding: 8px 14px;
            border-radius: 16px;
            background: #fff;
            color: #2b2340;
            font-weight: 800;
            font-size: .9rem;
            text-align: center
        }

        .say::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            margin-left: -6px;
            width: 12px;
            height: 12px;
            background: #fff;
            transform: rotate(45deg)
        }

        @media(max-width:640px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 26px 18px
            }

            .mw svg {
                width: 130px
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 18px 0
        }

        .tile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--bd)
        }

        .tile i {
            font-style: normal;
            font-size: 1.6rem;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--bg)
        }

        .tile b {
            display: block;
            font-size: 1.55rem;
            line-height: 1.05
        }

        .tile span {
            font-size: .85rem;
            color: var(--mu)
        }

        .ring {
            width: 44px;
            height: 44px;
            flex: none
        }

        .gc {
            position: relative;
            overflow: hidden;
            padding: 22px;
            color: #fff;
            background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 68%, #000));
            box-shadow: 0 18px 30px -16px var(--c)
        }

        .gc::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            right: -44px;
            top: -44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .14)
        }

        .gc .ic {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            margin-bottom: 8px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .22);
            font-size: 1.9rem
        }

        .gc h3 {
            font-size: 1.3rem
        }

        .gc p {
            margin: .3em 0 .8em
        }

        .gc small {
            color: rgba(255, 255, 255, .88)
        }

        .gc .bar {
            background: rgba(255, 255, 255, .28)
        }

        .gc .bar i {
            background: #fff !important
        }

        .gc .btn.sm {
            background: #fff;
            color: #2b2340;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .2)
        }

        .grid2 .card {
            border-left: 8px solid var(--c);
            padding: 18px 20px
        }

        .grid2 code {
            background: color-mix(in srgb, var(--c) 12%, var(--card));
            font-weight: 700;
            border-radius: 10px
        }

        .bar {
            height: 14px
        }

        .bar i {
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12)
        }

        .tabs button {
            border-radius: 999px;
            font-weight: 700
        }

        .tabs .on {
            box-shadow: 0 4px 0 var(--pd, #4a42cf)
        }

        .map {
            --w: clamp(46px, 13vw, 62px);
            display: block;
            padding: 20px 14px;
            border: 0;
            border-radius: 28px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--c) 11%, var(--card)), var(--card));
            box-shadow: 0 14px 34px -18px var(--c)
        }

        .row {
            position: relative;
            display: flex;
            justify-content: space-between;
            padding: 14px 0
        }

        .row::before {
            content: '';
            position: absolute;
            left: calc(var(--w)/2);
            right: calc(var(--w)/2);
            top: 50%;
            height: 10px;
            margin-top: -5px;
            border-radius: 6px;
            background: repeating-linear-gradient(90deg, var(--bd) 0 14px, transparent 14px 24px)
        }

        .row:not(:last-child)::after {
            content: '';
            position: absolute;
            right: calc(var(--w)/2 - 5px);
            width: 10px;
            top: 50%;
            height: 100%;
            border-radius: 6px;
            background: repeating-linear-gradient(180deg, var(--bd) 0 14px, transparent 14px 24px)
        }

        .row.r:not(:last-child)::after {
            right: auto;
            left: calc(var(--w)/2 - 5px)
        }

        .nd {
            position: relative;
            z-index: 1;
            width: var(--w);
            border: 0;
            font-size: 1.15rem;
            background: var(--card);
            color: var(--mu);
            box-shadow: 0 6px 0 var(--bd), inset 0 0 0 3px var(--bd)
        }

        .nd:disabled {
            opacity: .55
        }

        .nd:active:not(:disabled) {
            transform: translateY(4px)
        }

        .nd.dn {
            background: linear-gradient(160deg, #6fe6ae, var(--ok));
            color: #fff;
            box-shadow: 0 6px 0 #2e9c69
        }

        .nd.cur {
            background: linear-gradient(160deg, var(--pl), var(--p));
            color: #fff;
            box-shadow: 0 6px 0 var(--pd, #4a42cf);
            animation: pl 1.6s infinite
        }

        .nd.bs {
            background: linear-gradient(160deg, #ffd27a, var(--s));
            color: #5b3a00;
            box-shadow: 0 6px 0 #d98f1f
        }

        .nd.bs:disabled {
            filter: grayscale(.6)
        }

        @keyframes pl {
            50% {
                box-shadow: 0 6px 0 var(--pd, #4a42cf), 0 0 0 12px rgba(108, 99, 255, .18)
            }
        }

        #app h3 {
            font-size: 1.3rem
        }

        .big {
            font-size: 1.4rem;
            padding: 16px 18px;
            border-radius: 18px;
            background: var(--card)
        }

        .opt {
            padding: 14px 18px;
            border-radius: 18px;
            font-weight: 700;
            box-shadow: 0 4px 0 var(--bd);
            transition: transform .1s, border-color .15s
        }

        .opt:hover:not(:disabled) {
            border-color: var(--p);
            transform: translateY(-1px)
        }

        .opt.sel {
            background: color-mix(in srgb, var(--p) 10%, var(--card));
            box-shadow: 0 4px 0 var(--p)
        }

        .opt.ok {
            box-shadow: 0 4px 0 var(--ok)
        }

        .opt.no {
            background: rgba(229, 72, 77, .12);
            box-shadow: 0 4px 0 var(--bad)
        }

        .inp {
            padding: 14px 16px;
            font-size: 1.1rem;
            border-radius: 16px
        }

        .inp:focus {
            outline: 0;
            border-color: var(--p);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, .2)
        }

        .chip {
            border-radius: 14px;
            font-weight: 700;
            box-shadow: 0 3px 0 var(--bd)
        }

        .ans {
            padding: 8px;
            border: 2px dashed var(--bd);
            border-radius: 16px;
            background: var(--card)
        }

        .fb {
            border: 2px solid var(--ok);
            border-radius: 18px;
            background: rgba(69, 196, 134, .14)
        }

        .fb.no {
            border-color: var(--bad);
            background: rgba(229, 72, 77, .1)
        }

        .tutor {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding: 12px;
            border-radius: 14px;
            background: var(--card);
            font-size: .95rem
        }

        .tutor span {
            font-size: 1.6rem
        }

        .res {
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 32px 20px
        }

        .cf {
            position: absolute;
            top: -14px;
            left: var(--x);
            width: 9px;
            height: 14px;
            border-radius: 2px;
            background: var(--k);
            animation: fall 1.8s var(--d) ease-in forwards
        }

        @keyframes fall {
            to {
                transform: translateY(420px) rotate(540deg);
                opacity: 0
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .mw svg,
            .nd.cur {
                animation: none
            }

            .cf {
                display: none
            }
        }

        #who {
            display: flex;
            align-items: center;
            gap: 6px
        }

        #who .nick {
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--bg)
        }

        #who .nick em {
            font-style: normal;
            font-size: .72rem;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 6px;
            background: linear-gradient(135deg, #FFB84C, #ff8b4c);
            color: #2b2340
        }

        nav.lo button,
        body.lo #who {
            display: none
        }

        .chip:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .login {
            max-width: 460px;
            margin: 28px auto;
            padding: 30px 22px;
            text-align: center;
            cursor: default
        }

        .login:hover {
            transform: none
        }

        .login .mw svg {
            width: 116px
        }

        .login p {
            margin: .3em 0 1em
        }

        .login .inp {
            text-align: center;
            font-weight: 700
        }

        .login .btn.go {
            width: 100%;
            margin-top: 6px
        }

        .err {
            min-height: 1.5em;
            margin: 8px 0 4px;
            color: var(--bad);
            font-weight: 700
        }

        .recent {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--bd)
        }

        .god {
            --c: #FFB84C;
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            align-items: center;
            padding: 14px 18px;
            margin: 14px 0;
            border-radius: 22px;
            color: #fff;
            background: linear-gradient(135deg, #2b2340, #4a3a8a);
            box-shadow: 0 14px 28px -16px #4a3a8a
        }

        .god label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700
        }

        .god select,
        .god input {
            padding: 8px 10px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, .28);
            background: rgba(255, 255, 255, .12);
            color: #fff;
            font: inherit
        }

        .god select option {
            background: #2b2340;
            color: #fff
        }

        .god input[type=number] {
            width: 88px
        }

        .god select:focus-visible,
        .god input:focus-visible {
            outline: 3px solid var(--s);
            outline-offset: 2px
        }

        .god .btn.sm {
            margin: 0;
            color: #2b2340;
            box-shadow: 0 4px 0 #d98f1f
        }

            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--bd);
            background: var(--bg)
        }

        .cmp summary {
            cursor: pointer;
            font-weight: 700;
            min-height: 28px
        }

        .cmpg {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
            gap: 10px;
            margin: 10px 0
        }

        .vocab {
            list-style: none;
            padding: 0;
            margin: 6px 0 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 8px
        }

        .vocab li {
            display: grid;
            gap: 1px;
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--bd)
        }

        .vocab small {
            color: var(--mu)
        }

        .ref {
            margin-bottom: 14px
        }

        .ref:hover {
            transform: none
        }

        .rhead {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start
        }

        .search {
            position: relative;
            flex: 1;
            min-width: 220px
        }

        .search .i {
            position: absolute;
            left: 14px;
            top: 50%;
            margin-top: -.575em;
            color: var(--mu);
            pointer-events: none
        }

        .search .inp {
            padding-left: 42px
        }

        .tablewrap {
            overflow-x: auto;
            border-radius: var(--r2);
            border: 1px solid var(--bd);
            background: var(--card)
        }

        .irr {
            width: 100%;
            border-collapse: collapse;
            min-width: 520px
        }

        .irr th,
        .irr td {
            padding: 9px 14px;
            text-align: left;
            border-bottom: 1px solid var(--bd)
        }

        .irr thead th {
            position: sticky;
            top: 0;
            background: var(--card);
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--mu)
        }

        .irr tbody tr:hover {
            background: color-mix(in srgb, var(--p) 8%, transparent)
        }

        /* ---------- Làm bài ---------- */
        .qz {
            max-width: 760px;
            margin: 0 auto
        }

        .qtop {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap
        }

        .qmeta {
            flex: 1;
            margin: 0;
            min-width: 140px
        }

        .qhud {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .combo {
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--flame) 18%, var(--card));
            border: 2px solid var(--flame);
            animation: pop .35s both
        }

        .combo.hot {
            background: linear-gradient(135deg, #ff8a3d, #ff4d6d);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 18px -2px rgba(255, 90, 60, .8)
        }

        .qtimer {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .qtimer .bar {
            flex: 1;
            height: 8px;
            margin: 4px 0
        }

        .qtimer .bar i {
            background: var(--s);
            transition: width .25s linear
        }

        .qtimer .bar.low i {
            background: var(--bad)
        }

        .qtimer .bar.low {
            animation: shake .5s infinite
        }

        #qtime {
            font-weight: 800;
            min-width: 2.6em;
            text-align: right
        }

        .qz h2.h-sm {
            font-size: 1.3rem;
            margin: .6em 0 .5em;
            line-height: 1.3
        }

        .opts {
            display: grid;
            gap: 4px
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 54px;
            text-align: left
        }

        .opt .key {
            display: inline-grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 9px;
            border: 2px solid var(--bd);
            font-size: .85rem;
            font-weight: 800;
            flex: none;
            color: var(--mu)
        }

        .opt.sel .key {
            background: var(--p);
            border-color: var(--p);
            color: var(--onp)
        }

        .opt.ok .key {
            background: var(--ok);
            border-color: var(--ok);
            color: #fff
        }

        .opt.no .key {
            background: var(--bad);
            border-color: var(--bad);
            color: #fff
        }

        .opt.ok {
            animation: pulse .5s
        }

        .opt.no {
            animation: shake .4s
        }

        .opt.off {
            opacity: .4;
            text-decoration: line-through
        }

        .opt:disabled {
            cursor: default
        }

        .opts.frozen {
            opacity: .5;
            filter: grayscale(.6)
        }

        .opt .ot {
            flex: 1
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            20% {
                transform: translateX(-7px)
            }

            40% {
                transform: translateX(6px)
            }

            60% {
                transform: translateX(-4px)
            }

            80% {
                transform: translateX(3px)
            }
        }

        @keyframes pulse {
            40% {
                transform: scale(1.025)
            }
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin-top: 8px
        }

        .chip {
            min-height: 40px
        }

        .ans {
            min-height: 64px
        }

        .passage {
            margin: 12px 0
        }

        .passage p {
            margin: .3em 0 0;
            font-size: 1.05rem;
            line-height: 1.7
        }

        .fb {
            animation: viewin .3s both
        }

        .fb .lose {
            margin-top: 8px;
            font-weight: 800;
            color: #c0262d
        }

        :root[data-style="space"] .fb .lose,
        :root[data-style="future"] .fb .lose,
        :root[data-theme="dark"] .fb .lose {
            color: #ff8a90
        }

        .roast {
            margin: 8px 0 0;
            padding: 6px 10px;
            border-radius: 10px;
            background: color-mix(in srgb, var(--s) 18%, transparent);
            font-weight: 700
        }

        .why {
            margin-top: 8px
        }

        .why summary {
            cursor: pointer;
            font-weight: 700;
            min-height: 28px
        }

        .hintp {
            font-weight: 700
        }

        .kbd {
            font-size: .82rem
        }

        kbd {
            font: 800 .75rem 'Nunito', monospace;
            padding: 1px 6px;
            border-radius: 6px;
            border: 1px solid var(--bd);
            background: var(--card);
            box-shadow: 0 2px 0 var(--bd)
        }

        @media (hover:none) {
            .kbd {
                display: none
            }
        }

        .qbar {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: 14px;
            padding: 10px 0
        }

        .qbar .btn.sm {
            margin: 0
        }

        .btn.dodge {
            transition: transform .18s cubic-bezier(.3, 1.6, .5, 1)
        }

        @media (max-width: 720px) {
            .qbar {
                position: sticky;
                bottom: calc(var(--tab-h) + 6px + env(safe-area-inset-bottom, 0px));
                z-index: 6;
                padding: 10px;
                margin: 14px -4px 0;
                border-radius: var(--r2);
                background: color-mix(in srgb, var(--card) 92%, transparent);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                box-shadow: 0 -8px 24px -14px rgba(30, 30, 80, .5);
                justify-content: stretch
            }

            .qbar .btn {
                flex: 1
            }

            body.in-quiz main {
                padding-bottom: calc(var(--tab-h) + 100px) !important
            }
        }

        #fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 60;
            overflow: hidden
        }

        .fx {
            position: absolute;
            top: 55%;
            font: 800 1.6rem 'Baloo 2', sans-serif;
            color: var(--ok);
            text-shadow: 0 2px 0 rgba(0, 0, 0, .18);
            animation: rise 1.1s ease-out forwards
        }

        .fx.hot {
            color: var(--flame);
            font-size: 2rem
        }

        @keyframes rise {
            from {
                transform: translateY(0) scale(.6);
                opacity: 0
            }

            15% {
                opacity: 1;
                transform: translateY(-14px) scale(1.15)
            }

            to {
                transform: translateY(-110px) scale(1);
                opacity: 0
            }
        }

        /* ---------- Kết quả ---------- */
        .res .mw svg {
            width: 112px
        }

        .resg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            flex-wrap: wrap;
            margin: 10px 0
        }

        .rr {
            position: relative;
            display: grid;
            place-items: center
        }

        .rr b {
            position: absolute;
            font: 800 1.6rem 'Baloo 2', sans-serif
        }

        .rs {
            list-style: none;
            margin: 0;
            padding: 0;
            text-align: left;
            display: grid;
            gap: 4px
        }

        .rs b {
            font-size: 1.15rem
        }

        .bdl {
            list-style: none;
            max-width: 360px;
            margin: 10px auto;
            padding: 0;
            display: grid;
            gap: 4px
        }

        .bdl li {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 10px;
            background: var(--bg)
        }

        .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 14px
        }

        /* ---------- Hồ sơ, tài khoản ---------- */
        .pcard {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap
        }

        .pinfo {
            flex: 1;
            min-width: 220px
        }

        .pinfo .rank {
            margin: 0 0 6px;
            font-weight: 800;
            color: var(--mu)
        }

        .pact {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .tiles {
            margin: 14px 0
        }

        .chart {
            width: 100%;
            height: auto;
            max-height: 220px
        }

        .chart .bx {
            fill: color-mix(in srgb, var(--p) 55%, var(--bd))
        }

        .chart .bx.hit {
            fill: var(--ok)
        }

        .chart .bx.now {
            stroke: var(--s);
            stroke-width: 2
        }

        .chart .gl {
            stroke: var(--s);
            stroke-dasharray: 4 4;
            stroke-width: 1.5
        }

        .chart text {
            font: 700 9px 'Nunito', sans-serif;
            fill: var(--mu)
        }

        .chart .gv {
            fill: var(--tx)
        }

        .achs .ach {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 14px 16px;
            cursor: default
        }

        .achs .ach:hover {
            transform: none
        }

        .ach .ai {
            font-size: 1.9rem;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: color-mix(in srgb, var(--s) 22%, var(--card));
            flex: none
        }

        .ach.lockd {
            opacity: 1
        }

        .ach.lockd .ai {
            filter: grayscale(1);
            opacity: .55;
            background: var(--bg)
        }

        .hist {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 6px
        }

        .hist li {
            display: grid;
            grid-template-columns: 100px 1fr 90px 52px;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--bd);
            align-items: center
        }

        @media (max-width: 560px) {
            .hist li {
                grid-template-columns: 1fr 1fr;
            }
        }

        .acc {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 6px 0 4px
        }

        .acc small {
            display: block;
            color: var(--mu)
        }

        .avs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .av-b {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: 3px solid var(--bd);
            background: var(--card);
            font-size: 1.5rem;
            cursor: pointer
        }

        .av-b.on {
            border-color: var(--p);
            background: color-mix(in srgb, var(--p) 14%, var(--card))
        }

        .row2 .inp {
            width: auto
        }

        .row2.chk,
        .row2.rng {
            display: flex;
            min-height: 44px;
            cursor: pointer
        }

        .row2.rng {
            flex-wrap: wrap
        }

        .row2.rng input[type=range] {
            flex: 1;
            min-width: 160px
        }

        input[type=checkbox] {
            width: 22px;
            height: 22px;
            accent-color: var(--p)
        }

        input[type=range] {
            accent-color: var(--p);
            min-height: 32px
        }

        .mono {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: .85rem;
            word-break: break-all;
            resize: vertical
        }

        .bks {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 8px
        }

        .bks li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--bd)
        }

        .bks .btn.sm {
            margin: 0
        }

        .plist {
            list-style: none;
            margin: 14px 0;
            padding: 0;
            display: grid;
            gap: 8px
        }

        .prof-b {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 14px;
            border-radius: 16px;
            border: 2px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            font: inherit;
            text-align: left;
            cursor: pointer;
            min-height: 56px;
            box-shadow: 0 3px 0 var(--bd)
        }

        .prof-b:hover {
            border-color: var(--p)
        }

        .prof-b .pt small {
            display: block;
            color: var(--mu)
        }

        .errc {
            max-width: 520px;
            margin: 40px auto;
            text-align: center
        }

        /* ---------- Thông báo, hộp thoại ---------- */
        #toasts {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            z-index: 80;
            display: grid;
            gap: 8px;
            width: min(92vw, 440px);
            pointer-events: none
        }

        @media (max-width: 720px) {
            #toasts {
                bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 84px)
            }

            body:not(.in-quiz) #toasts {
                bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 14px)
            }
        }

        .toast {
            padding: 12px 16px;
            border-radius: 16px;
            background: var(--tx);
            color: var(--bg);
            font-weight: 700;
            box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .55);
            animation: toastin .35s cubic-bezier(.2, 1.3, .4, 1) both
        }

        .toast.ok {
            background: #1f8a57;
            color: #fff
        }

        .toast.bad {
            background: #c0262d;
            color: #fff
        }

        .toast.ach {
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: #fff
        }

        .toast.out {
            opacity: 0;
            transform: translateY(8px);
            transition: .3s
        }

        @keyframes toastin {
            from {
                transform: translateY(16px) scale(.9);
                opacity: 0
            }
        }

        dialog {
            width: min(92vw, 440px);
            padding: 24px;
            border: 0;
            border-radius: var(--r3);
            background: var(--card);
            color: var(--tx);
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .6);
            text-align: center
        }

        dialog::backdrop {
            background: rgba(14, 16, 40, .62);
            backdrop-filter: blur(4px)
        }

        dialog[open] {
            animation: pop .3s cubic-bezier(.2, 1.3, .4, 1)
        }

        dialog h2 {
            margin: .2em 0 .4em
        }

        .dlg-i {
            font-size: 3rem;
            line-height: 1
        }

        .dlg-b {
            text-align: left
        }

        .dlg-a {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .login .plist {
            text-align: left
        }

        /* ---------- Trợ năng: chuyển động, tương phản, forced-colors, in ---------- */
        :root[data-motion="reduce"] *,
        :root[data-motion="reduce"] *::before,
        :root[data-motion="reduce"] *::after {
            animation-duration: .001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: .001ms !important;
            scroll-behavior: auto !important
        }

        :root[data-motion="reduce"] .cf,
        :root[data-motion="reduce"] .fx,
        :root[data-motion="reduce"] .cosmos .comet {
            display: none
        }

        :root[data-contrast="high"] {
            --bd: #6b7194;
            --mu: #333a5c
        }

        :root[data-contrast="high"][data-theme="dark"],
        :root[data-contrast="high"][data-style="space"],
        :root[data-contrast="high"][data-style="future"] {
            --bd: #c9cdf2;
            --mu: #dfe2ff
        }

        :root[data-contrast="high"] .card,
        :root[data-contrast="high"] .tile,
        :root[data-contrast="high"] .opt,
        :root[data-contrast="high"] .chip,
        :root[data-contrast="high"] .btn {
            border: 2px solid currentColor !important;
            backdrop-filter: none !important
        }

        :root[data-contrast="high"] .gc {
            background: #1d1f3a !important;
            color: #fff
        }

        @media (forced-colors: active) {

            .btn,
            .opt,
            .chip,
            .card,
            .tile,
            .nd,
            #tabs button,
            .tools button {
                border: 1px solid ButtonText;
                forced-color-adjust: auto
            }

            .nd.cur,
            #tabs button.on,
            .opt.sel {
                outline: 3px solid Highlight
            }
        }

        @media print {

            .top,
            #tabs,
            .noprint,
            .btn,
            .cosmos,
            #toasts,
            .skip {
                display: none !important
            }

            body {
                background: #fff !important;
                color: #000 !important
            }

            .card,
            .tile {
                box-shadow: none !important;
                border: 1px solid #999 !important;
                break-inside: avoid;
                background: #fff !important;
                color: #000 !important
            }

            .grid1 {
                display: block
            }

            .ref {
                margin-bottom: 10px
            }

            details {
                display: block
            }

            details>* {
                display: block
            }

            :root {
                --mu: #333
            }
        }

        @media (max-height: 480px) and (orientation: landscape) {
            .hero {
                padding: 16px 22px
            }

            .mw svg {
                width: 90px !important
            }

            :root {
                --head-h: 52px
            }
        }

        @media (max-width: 380px) {
            h1.pg {
                font-size: 1.45rem
            }

            .card {
                padding: 14px
            }

            .btn {
                padding: 11px 16px
            }
        }

        :root[data-style="chess"] .tabs .on {
            color: #fff
        }

        @media (max-width: 440px) {
            #who .nick {
                display: none
            }
        }

        /* Thanh tab cố định nằm trong .top: .top không được tạo containing block (backdrop-filter) trên điện thoại */
        @media (max-width: 720px) {

            .top,
            :root[data-style] .top {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important
            }

            .top::before {
                content: "";
                position: absolute;
                inset: 0;
                z-index: -1;
                pointer-events: none;
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px)
            }
        }

        :root[data-style="chess"] #tabs button.on,
        :root[data-style="chess"] .tools button.on {
            background: #1c513d;
            color: #fff
        }

    </style>
</head>

}

const pinV = () => `<section class="card login" style="cursor:default"><div class="mw">${MAS("happy")}</div><h1 class="h-lg">Hồ sơ ${esc(pendLogin ? pendLogin.n : "")}</h1><p>Nhập mã PIN để mở hồ sơ này.</p><label class="sr" for="pin-in">Mã PIN</label><input id="pin-in" class="inp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••"><div id="perr" class="err" role="alert"></div><button class="btn go" ${A("pinTry")}>MỞ KHÓA</button><button class="btn ghost" style="margin-top:10px;width:100%" ${A("logout")}>Quay lại</button></section>`;


/* ===== account.js ===== */
/* =====================================================================
   ACCOUNT — hồ sơ, PIN, Google, sao lưu / nhập / mã đồng bộ
   ===================================================================== */
const GOOGLE_CLIENT_ID = "264761779796-31gic7vh1n1kr7c1bijvlcn72dihtlqt.apps.googleusercontent.com";
const googleReady = () => /^[\w-]+\.apps\.googleusercontent\.com$/.test(GOOGLE_CLIENT_ID);
function decodeGoogleCredential(jwt) { const part = jwt.split(".")[1]; if (!part) throw Error("Invalid credential"); const raw = atob(part.replace(/-/g, "+").replace(/_/g, "/")); const bytes = Uint8Array.from(raw, c => c.charCodeAt(0)); return JSON.parse(new TextDecoder().decode(bytes)) }
function handleGoogleCredential(response) { try { const profile = decodeGoogleCredential(response.credential || ""); if (!profile.sub || !profile.email_verified) throw Error("Unverified Google account"); enter(cleanName(profile.name || profile.email.split("@")[0]), "google:" + profile.sub) } catch (e) { loginErr("Không thể xác minh phiên Google. Hãy thử lại.", "lerr2") } }
function gLoad() { if (!googleReady()) return; if (window.google && google.accounts) return gBtn(); if (document.getElementById("google-gsi")) return; const sc = document.createElement("script"); sc.id = "google-gsi"; sc.src = "https://accounts.google.com/gsi/client"; sc.async = true; sc.onload = gBtn; sc.onerror = () => loginErr("Không tải được Google Sign-In. Kiểm tra kết nối mạng.", "lerr2"); document.head.appendChild(sc) }
function gBtn() { const d = $("gbtn"); if (!d || !window.google || !googleReady()) return; try { google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential, auto_select: false, cancel_on_tap_outside: true }); d.replaceChildren(); google.accounts.id.renderButton(d, { theme: ST.style === "space" || ST.style === "future" ? "filled_black" : "outline", size: "large", shape: "pill", text: "continue_with", locale: "vi", width: 300 }) } catch (e) { loginErr("Google Sign-In chưa được cấu hình đúng tên miền / Client ID.", "lerr2") } }
function loginErr(m, id) { const e = $(id || "lerr"); if (e) e.textContent = m }

/* ---------- Vào / thoát hồ sơ ---------- */
function setUser(n, id) {
    n = n.trim(); user = n; uid = id || n.toLowerCase(); god = isGod(n);
    if (rd(key(uid)) === null && !god && rd("t12") !== null && rd("t12_moved") === null) { wr(key(uid), rd("t12")); wr("t12_moved", "1") }
    const L = load(); st = L.s; qs = []; qi = 0; fb = null; res = null; wr("t12_nick", n); id ? wr("t12_uid", id) : rm("t12_uid");
    if (!god) rememberProfile(uid, n, !!(id && String(id).startsWith("google:")));

}
function enter(n, id) {

}
function finishEnter(n, id) { setUser(n, id || undefined); pendLogin = null; ui = { v: "home" }; render(); scrollTo(0, 0); if (!STORE.ok) toast("⚠ Trình duyệt đang chặn lưu trữ. Hãy xuất file sao lưu thường xuyên.", "bad", 6000) }

    enter(v)
}
function logout() { taStop(); qdl = 0; rm("t12_nick"); rm("t12_uid"); if (user) save(); uid = null; user = null; god = false; st = init(); qs = []; qi = 0; fb = null; res = null; pendLogin = null; ui = { v: "home" }; render(); scrollTo(0, 0) }

/* ---------- PIN ---------- */
let pinFails = 0, pinLock = 0;

    else { pinFails++; if (pinFails >= 3) { pinLock = Date.now() + 10000; pinFails = 0 } $("perr").textContent = "PIN chưa đúng."; e.value = ""; sfx("bad") }
}
function pinSet() {

    const s = Math.random().toString(36).slice(2, 10); setMeta(uid, { pin: { s, h: hx(s + ":" + v) } }); toast("🔒 Đã đặt PIN cho hồ sơ này", "ok"); render()
}

/* ---------- Tên, ảnh đại diện ---------- */
function rename() {

    user = v; wr("t12_nick", v); wr("t12_profiles", JSON.stringify(profiles().map(p => p.id === uid ? Object.assign({}, p, { n: v }) : p))); wr("t12_users", JSON.stringify(profiles().filter(p => !p.g).map(p => p.n)));

}

/* ---------- Xuất / nhập / mã đồng bộ ---------- */
const slug = s => fold(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "ho-so";
const strip = () => Object.assign({}, st, { at: {} });
function exportData() { const data = strip(), body = { app: "t12", v: 2, name: user, at: Date.now(), data, sum: hx(JSON.stringify(data)) }; download(`12-thi-${slug(user)}-${today()}.json`, JSON.stringify(body)); toast("Đã xuất file sao lưu", "ok") }
function importPick() { const i = $("imp"); if (i) i.click() }
async function importFile() { const f = this.files && this.files[0]; if (!f) return; const el = this; try { if (f.size > 4e6) throw 0; const o = JSON.parse(await f.text()); if (!o || o.app !== "t12" || !o.data) throw 0; el.value = ""; await applyMerge(o.data) } catch (e) { el.value = ""; toast("File không hợp lệ hoặc không phải bản sao lưu của ứng dụng này.", "bad") } }
async function applyMerge(raw) {
    const m = merge(st, raw), a = tot(), b = sumC(m);
    const yes = await confirmBox("Gộp tiến độ?", `<p>Hiện tại: <b>${fmtN(a)}</b> level · <b>${fmtN(st.xp)}</b> XP.</p><p>Sau khi gộp: <b>${fmtN(b)}</b> level · <b>${fmtN(m.xp)}</b> XP.</p><p class="mu">Gộp luôn giữ giá trị lớn hơn của hai bên, nên không làm mất tiến độ.</p>`, "Gộp ngay", "Hủy");
    if (!yes) return; backup(); st = m; checkAch(true); save(); toast("✅ Đã gộp tiến độ", "ok"); render()
}
const toB64 = u => { let s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") };
const fromB64 = t => { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; const s = atob(t), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u };
async function pipeBytes(u8, S) { const cs = new S("deflate-raw"), w = cs.writable.getWriter(); w.write(u8); w.close(); return new Uint8Array(await new Response(cs.readable).arrayBuffer()) }
async function syncMake() {
    const raw = new TextEncoder().encode(JSON.stringify(strip())); let code;
    try { if (!window.CompressionStream) throw 0; code = "T12S1." + toB64(await pipeBytes(raw, CompressionStream)) } catch (e) { code = "T12S0." + toB64(raw) }
    $("syncbox").value = code; copyText(code)
}
async function syncUse() {
    const t = ($("syncbox").value || "").trim().replace(/\s+/g, ""), m = t.match(/^T12S([01])\.([\w-]+)$/); if (!m || t.length > 6e5) return toast("Mã không hợp lệ.", "bad");
    try { let u = fromB64(m[2]); if (m[1] === "1") u = await pipeBytes(u, DecompressionStream); await applyMerge(JSON.parse(new TextDecoder().decode(u))) } catch (e) { toast("Không đọc được mã. Hãy sao chép lại đầy đủ.", "bad") }
}
function restoreBackup(i) {
    const b = backups()[i]; if (!b) return;
    confirmBox("Khôi phục bản sao lưu?", `<p>Bản lúc <b>${new Date(b.ts).toLocaleString("vi-VN")}</b> (${fmtN(b.n || 0)} level · ${fmtN(b.xp || 0)} XP) sẽ thay thế tiến độ hiện tại.</p><p class="mu">Tiến độ hiện tại cũng được lưu thành một bản sao lưu mới trước khi thay.</p>`, "Khôi phục", "Hủy", 1).then(v => { if (!v) return; try { const s = sanitize(JSON.parse(b.data)); backup(); st = s; save(); toast("✅ Đã khôi phục", "ok"); render() } catch (e) { toast("Bản sao lưu bị hỏng.", "bad") } })
}
function delProfile() {
    confirmBox("Xóa hồ sơ này?", `<p>Toàn bộ tiến độ của <b>${esc(user)}</b> trên thiết bị này (kể cả các bản sao lưu tự động) sẽ bị xóa vĩnh viễn.</p><p class="mu">Hãy xuất file sao lưu trước nếu bạn muốn giữ lại.</p>`, "Xóa vĩnh viễn", "Hủy", 1).then(v => { if (v) { const id = uid; user = null; forgetProfile(id); logout(); toast("Đã xóa hồ sơ", "ok") } })
}
function persist() { navigator.storage.persist().then(v => { persisted = v; toast(v ? "✅ Đã bật lưu trữ bền vững" : "Trình duyệt chưa cho phép lưu trữ bền vững.", v ? "ok" : "info"); render() }).catch(() => { }) }

/* ---------- Sổ tay, cài đặt: hành động nhỏ ---------- */
function refTab(t) { ui = Object.assign({}, ui, { tab: t, q: "", rg: null }); render() }
function refGroup(g) { ui = Object.assign({}, ui, { rg: g }); render() }
function refQ(v) { ui.q = v; const l = $("ref-list"); if (l) l.innerHTML = refList() }
function printRef() { window.print() }
function setRange(k, v) { v = num(v); if (k == "fs") { setS("fs", v, 1); const o = $("o-fs"); if (o) o.textContent = v + "%" } else { setS(k, v / 100, 1); const o = $("o-" + k); if (o) o.textContent = Math.round(v) + "%" } }

/* =====================================================================
   ACTIONS — bảng hành động duy nhất cho mọi data-a / data-c / data-i
   ===================================================================== */
const ACT = { go, cont, open_, start, startRev, startHrev, startDaily, startMT, startTRF, startGN, startReading, startC2, startIrr, startSig, taStart, taPick, sp, ad, un, mS, mR, chk, nx, useHint, quit, setS, setRange, sfx, togMusic, enter, doLogin, logout, godGo, copyBank, shareProfile, pinTry, pinSet, pinClear, rename, setAvatar, exportData, importPick, importFile, syncMake, syncUse, restoreBackup, delProfile, persist, refTab, refGroup, refQ, printRef, reset: () => go("home") };
const argsOf = el => { try { return JSON.parse(el.dataset.args || "[]") } catch (e) { return [] } };
function run(fn, el, args) { try { const r = fn.apply(el, args); if (r && r.catch) r.catch(e => console.error(e)) } catch (err) { console.error(err); toast("Có lỗi nhỏ, đã bỏ qua thao tác.", "bad") } }
document.addEventListener("click", e => { const el = e.target.closest && e.target.closest("[data-a]"); if (!el || el.disabled || el.getAttribute("aria-disabled") === "true") return; const fn = ACT[el.dataset.a]; if (fn) run(fn, el, argsOf(el)) });
const onVal = k => e => { const el = e.target.closest && e.target.closest(`[data-${k}]`); if (!el) return; const fn = ACT[el.dataset[k]]; if (!fn) return; const v = el.type === "checkbox" ? (el.checked ? (el.dataset.on ?? 1) : (el.dataset.off ?? 0)) : el.value; run(fn, el, [...argsOf(el), v]) };
document.addEventListener("change", onVal("c")); document.addEventListener("input", onVal("i"));

/* Phím tắt */
document.addEventListener("keydown", e => {
    const t = e.target, tag = t.tagName, typing = tag == "INPUT" || tag == "TEXTAREA" || tag == "SELECT";
    if (e.key == "Enter" && !e.repeat) {
        if (t.id == "nick") { e.preventDefault(); return doLogin() } if (t.id == "pin-in") { e.preventDefault(); return pinTry() } if (t.id == "gl") { e.preventDefault(); return godGo() }
        if (ui.v == "quiz") {
            if (t.id == "in") { e.preventDefault(); return fb ? nx() : chk() }
            if (!typing && t.dataset && t.dataset.a == "sp" && t.getAttribute("aria-pressed") == "true" && !fb) { e.preventDefault(); return chk() }
            if (fb && !typing && !(tag == "BUTTON" && t.dataset.a)) { e.preventDefault(); return nx() }
            if (!fb && !typing && tag != "BUTTON" && tag != "A" && tag != "SUMMARY") { e.preventDefault(); return chk() }
        }
    }
    if (typing || e.ctrlKey || e.metaKey || e.altKey || !user) return;
    if (ui.v == "quiz" && ST.kb && !fb) {
        const x = qs[qi]; if (/^[1-9]$/.test(e.key) && x && x.k == "mc") { const i = +e.key - 1; if (i < x.o.length) { e.preventDefault(); sp(i) } }
        else if ((e.key == "h" || e.key == "H") && x && canHint(x)) { e.preventDefault(); useHint() }
    }
    if (ui.v == "ta" && ta.q && /^[1-9]$/.test(e.key) && +e.key <= ta.q.o.length) { e.preventDefault(); taPick(+e.key - 1) }
});
/* Nút Kiểm tra biết né (độ cay cao nhất, chỉ với chuột) */
document.addEventListener("pointerover", e => {
    if (e.pointerType != "mouse" || ui.v != "quiz" || fb || dodgeAt || !saltOn() || ST.salt < 3 || document.documentElement.dataset.motion == "reduce") return;
    const b = e.target.closest && e.target.closest("#chk"); if (!b) return; const r = b.getBoundingClientRect(); let dx = 60 + Math.floor(Math.random() * 40); if (r.right + dx > innerWidth - 8) dx = -dx; if (r.left + dx < 8) dx = 0;
    dodgeAt = [dx, Math.floor(Math.random() * 24) - 12]; b.style.transform = `translate(${dodgeAt[0]}px,${dodgeAt[1]}px)`
});
document.addEventListener("visibilitychange", () => { if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt) { if (qdl) qdl += Date.now() - hiddenAt; hiddenAt = 0 } });
let errAt = 0; const onErr = e => { console.error(e); if (Date.now() - errAt > 6000) { errAt = Date.now(); toast("Có lỗi nhỏ xảy ra, nhưng tiến độ của bạn vẫn an toàn.", "bad") } };
window.addEventListener("error", onErr); window.addEventListener("unhandledrejection", onErr);

/* =====================================================================
   SELF-TEST — kiểm tra bộ sinh câu hỏi và nội dung (chạy: T12.selfTest())
   ===================================================================== */
function selfTest() {
    const fails = []; let n = 0;
    const chkq = (x, tag) => {
        n++; try {
            if (/undefined|NaN|\[object|null/.test(JSON.stringify(x))) fails.push(tag + ": văn bản lỗi");
            if (x.k == "mc") { if (!x.o.includes(x.a)) fails.push(tag + ": đáp án không nằm trong lựa chọn"); if (new Set(x.o).size != x.o.length) fails.push(tag + ": lựa chọn trùng"); if (x.o.length < 2) fails.push(tag + ": thiếu lựa chọn") }
            else if (x.k == "order") { if (x.a.split(" ").sort().join(" ") != x.tk.slice().sort().join(" ")) fails.push(tag + ": thẻ sắp xếp không khớp đáp án") }
            else if (x.k == "fill") { if (!(x.acc || [x.a]).length || !x.stem) fails.push(tag + ": câu điền thiếu dữ liệu") }
            else if (x.k == "match") { if (new Set(x.a).size != x.L.length) fails.push(tag + ": ghép trùng") }
        } catch (e) { fails.push(tag + ": " + e.message) }
    };
    for (let t = 0; t < 12; t++) for (const l of [1, 15, 30, 45, 70, 120, 250, 420, 500]) for (const k of kinds(l)) for (let s = 1; s <= 3; s++) chkq(gen(t, s * 37 + l, l, k), `gen t${t} l${l} ${k}`);
    GNN.forEach((z, i) => { if (z[0] == z[1]) fails.push("GNN " + i + ": câu sai trùng câu đúng"); chkq(mkGN(z, i), "GNN " + i) });
    READ.forEach((z, i) => { if (!z[2][z[3]]) fails.push("READ " + i + ": chỉ số đáp án sai"); chkq(mkRead(z, i), "READ " + i) });
    TRF.forEach((z, i) => { const p = z.split("|"); if (p.length != 5 || !TN[p[0]] || !TN[p[1]]) fails.push("TRF " + i + ": sai định dạng"); chkq(mkTrf(z, i), "TRF " + i) });
    for (let d = 0; d < 5; d++) for (let s = 0; s < 5; s++) chkq(mkMatch(s + d * 9, d), "match " + d);
    for (let i = 0; i < 30; i++) { chkq(mkIrr(R(i + 5), i), "irr " + i); chkq(mkSig(R(i + 9), i), "sig " + i) }
    const s0 = JSON.stringify(sanitize(init())), s1 = JSON.stringify(sanitize(JSON.parse(s0))); if (s0 != s1) fails.push("sanitize không ổn định");
    if (TL.length != 12 || CMP.length != 12 || MNEMO.length != 12) fails.push("TL/CMP/MNEMO phải đủ 12 thì");
    return { checked: n, fails }
}
window.T12 = { selfTest, version: "2.0" };

{

}
