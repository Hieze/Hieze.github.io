<script>
const TN=[
["Hiện tại đơn","Present Simple","(+) S + V(s/es) · (−) S + do/does not + V · (?) Do/Does + S + V?","Thói quen, sự thật hiển nhiên, lịch trình","every day (mỗi ngày), every morning (mỗi sáng), on Sundays (vào các Chủ nhật)","Quên thêm -s/-es với he/she/it; đã dùng does mà vẫn thêm -s."],
["Hiện tại tiếp diễn","Present Continuous","(+) S + am/is/are + V-ing · (−) S + am/is/are not + V-ing · (?) Am/Is/Are + S + V-ing?","Hành động đang diễn ra ngay lúc nói","now (bây giờ), at the moment (vào lúc này), right now (ngay lúc này)","Thiếu to be hoặc quên đuôi -ing."],
["Hiện tại hoàn thành","Present Perfect","(+) S + have/has + V3 · (−) S + have/has not + V3 · (?) Have/Has + S + V3?","Hành động đã xảy ra và còn liên quan đến hiện tại","this week (tuần này), many times (nhiều lần), today (hôm nay), this year (năm nay)","Dùng V2 thay cho V3; chia sai have/has."],
["Hiện tại hoàn thành tiếp diễn","Present Perfect Continuous","(+) S + have/has been + V-ing · (−) S + have/has not been + V-ing · (?) Have/Has + S + been + V-ing?","Hành động kéo dài từ quá khứ đến nay, nhấn mạnh quá trình","for two hours (suốt hai tiếng), since morning (từ sáng), all day (cả ngày), lately (gần đây)","Quên been hoặc quên -ing."],
["Quá khứ đơn","Past Simple","(+) S + V2/-ed · (−) S + did not + V · (?) Did + S + V?","Hành động đã xảy ra và kết thúc trong quá khứ","yesterday (hôm qua), last night (tối qua), two days ago (hai ngày trước), last week (tuần trước)","Đã có did mà vẫn chia động từ ở V2."],
["Quá khứ tiếp diễn","Past Continuous","(+) S + was/were + V-ing · (−) S + was/were not + V-ing · (?) Was/Were + S + V-ing?","Hành động đang diễn ra tại một thời điểm trong quá khứ","at 8 o'clock yesterday (lúc 8 giờ hôm qua), at this time yesterday (vào giờ này hôm qua)","Nhầm was/were."],

["Quá khứ hoàn thành tiếp diễn","Past Perfect Continuous","(+) S + had been + V-ing · (−) S + had not been + V-ing · (?) Had + S + been + V-ing?","Hành động kéo dài liên tục trước một mốc trong quá khứ","for two hours before ... (suốt hai tiếng trước khi ...), all morning before ... (cả buổi sáng trước khi ...)","Quên been."],
["Tương lai đơn","Future Simple","(+) S + will + V · (−) S + will not + V · (?) Will + S + V?","Quyết định tức thời, dự đoán, lời hứa","tomorrow (ngày mai), next week (tuần sau), tonight (tối nay), next month (tháng sau)","Thêm to hoặc -s sau will."],
["Tương lai tiếp diễn","Future Continuous","(+) S + will be + V-ing · (−) S + will not be + V-ing · (?) Will + S + be + V-ing?","Hành động đang diễn ra tại một thời điểm trong tương lai","at 8 o'clock tomorrow (lúc 8 giờ ngày mai), at this time tomorrow (vào giờ này ngày mai)","Quên be sau will."],
["Tương lai hoàn thành","Future Perfect","(+) S + will have + V3 · (−) S + will not have + V3 · (?) Will + S + have + V3?","Hành động sẽ hoàn tất trước một mốc trong tương lai","by next Friday (trước thứ Sáu tuần sau), by the end of this year (trước cuối năm nay)","Dùng V2 thay cho V3."],

function tone(f,t0,d,w,g,out){const o=AC.createOscillator(),e=AC.createGain();o.type=w;o.frequency.value=f;e.gain.setValueAtTime(.0001,t0);e.gain.exponentialRampToValueAtTime(g,t0+.015);e.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(e);e.connect(out);o.start(t0);o.stop(t0+d+.05)}
function sfx(k){if(!ST.sfx||!ac())return;const t=AC.currentTime;(({ok:[[76,0,.12],[83,.09,.25]],bad:[[48,0,.22,"sawtooth"],[45,.12,.32,"sawtooth"]],win:[[72,0,.14],[76,.12,.14],[79,.24,.14],[84,.36,.45]],lose:[[67,0,.2],[62,.18,.2],[55,.36,.35]],end:[[84,0,.15],[79,.15,.15],[72,.3,.45]]})[k]||[]).forEach(([m,d,l,w])=>tone(hz(m),t+d,l,w||"triangle",.5,SG))}
const TRK={home:{b:92,w:"triangle",ch:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],pt:[0,1,2,1,0,1,2,1]},
 study:{b:76,w:"sine",ch:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],pt:[0,2,1,2,0,2,1,2]},
 mt:{b:126,w:"square",q:.3,ch:[[67,71,74],[64,67,71],[60,64,67],[62,66,69]],pt:[0,2,1,2,0,2,1,2]},
 trf:{b:88,w:"triangle",ch:[[62,65,69],[58,62,65],[55,58,62],[57,61,64]],pt:[0,1,2,1,2,1,0,1]},
 ta:{b:148,w:"sawtooth",q:.26,k:1,ch:[[57,60,64],[57,60,64],[53,57,60],[55,59,62]],pt:[0,1,2,1,0,2,1,2]}};
const trackFor=()=>{const v=ui.v;return!user?"home":v=="ta"?"ta":v=="quiz"?(mode=="mt"?"mt":mode=="trf"?"trf":"study"):["path","group","map","learn","review"].includes(v)?"study":"home"};
function sync(){if(!ST.mus){mcur="";return}const w=trackFor();if(AC&&AC.state=="running"&&mcur!=w){mcur=w;mstep=0;nextT=AC.currentTime+.15}}
function mtick(){if(!AC||!mcur||!ST.mus||AC.state!="running")return;const T=TRK[mcur];while(nextT<AC.currentTime+.3){const e=30/(T.b*(mcur=="ta"&&ta.on?1+(60-taLeft())/60*.3:1)),c=T.ch[Math.floor(mstep/T.pt.length)%T.ch.length],n=c[T.pt[mstep%T.pt.length]]+(mstep%8==7?12:0);tone(hz(n),nextT,e*1.8,T.w,(T.q||.22)*.5,MG);if(mstep%4==0)tone(hz(c[0]-24),nextT,e*3.6,"sine",.3,MG);if(T.k&&mstep%2==1)tone(hz(c[0]+24),nextT,e*.6,"square",.06,MG);nextT+=e;mstep++}}
const unlock=()=>{if(ac()){vol();sync()}};
document.addEventListener("pointerdown",unlock);document.addEventListener("keydown",unlock);
document.addEventListener("visibilitychange",()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
setInterval(mtick,120);

function setUser(n,id){n=n.trim();user=n;uid=id||n.toLowerCase();god=isGod(n);
 if(rd(key(uid))===null&&!god&&rd("t12")!==null&&rd("t12_moved")===null){wr(key(uid),rd("t12"));wr("t12_moved","1")}
 st=load();qs=[];qi=0;fb=null;res=null;wr("t12_nick",n);id?wr("t12_uid",id):rm("t12_uid");
 if(!god&&!id){const a=recent().filter(x=>x.toLowerCase()!=n.toLowerCase());a.unshift(n);wr("t12_users",JSON.stringify(a.slice(0,6)))}
 save()}
function enter(n,id){setUser(n,id);ui={v:"home"};render();scrollTo(0,0)}
function doLogin(){const v=($("nick").value||"").trim().replace(/\s+/g," ");
 if(!v)return loginErr("Hãy nhập nickname của bạn nhé.");
 if(!NICK_RE.test(v))return loginErr("Nickname dài 2–20 ký tự, chỉ gồm chữ, số, dấu cách và các ký tự _ . -");
 enter(v)}
function loginErr(m,id){$(id||"lerr").textContent=m}
function logout(){taStop();rm("t12_nick");rm("t12_uid");uid=null;user=null;god=false;st=init();qs=[];qi=0;fb=null;res=null;ui={v:"home"};render();scrollTo(0,0)}
function login(){const r=recent();return`<section class="card login"><div class="mw">${MAS}</div><h2>Chào mừng bạn!</h2><p>Nhập nickname để lưu tiến độ học riêng của bạn trên máy này.</p><input id="nick" class="inp" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Nickname" placeholder="Nickname của bạn" onkeydown="if(event.key=='Enter')doLogin()"><div id="lerr" class="err" role="alert"></div><button class="btn go" onclick="doLogin()">VÀO HỌC</button>${r.length?`<div class="recent"><small>Đã học trên máy này:</small><br>${r.map(n=>`<button class="chip" data-n="${esc(n)}" onclick="enter(this.dataset.n)">${esc(n)}</button>`).join("")}</div>`:""}<div class="or"><span>hoặc dùng Gmail</span></div><input id="em" class="inp" type="email" autocomplete="email" autocapitalize="off" aria-label="Gmail" placeholder="ten@gmail.com"><input id="pw" class="inp" type="password" autocomplete="current-password" aria-label="Mật khẩu" placeholder="Mật khẩu (từ 6 ký tự)" style="margin-top:8px" onkeydown="if(event.key=='Enter')gmail(0)"><div id="lerr2" class="err" role="alert"></div><div class="two"><button class="btn" onclick="gmail(0)">Đăng nhập</button><button class="btn" onclick="gmail(1)">Đăng ký</button></div>${GCID?`<div id="gbtn" style="margin-top:14px;display:flex;justify-content:center"></div>`:""}</section>`}
function godPanel(t,l){if(!god)return"";return`<div class="god"><b>👑 God mode · mọi level đã mở khóa</b><label>Thì <select id="gt">${TN.map((T,i)=>`<option value="${i}"${i==t?" selected":""}>${i+1}. ${T[1]}</option>`).join("")}</select></label><label>Level <input id="gl" type="number" min="1" max="500" inputmode="numeric" value="${l}" onkeydown="if(event.key=='Enter')godGo()"></label><button class="btn sm" onclick="godGo()">Vào level</button></div>`}
function godGo(){if(!god)return;const t=+$("gt").value,l=Math.max(1,Math.min(500,parseInt($("gl").value,10)||1));open_(t,l)}
{const n=rd("t12_nick");if(n&&NICK_RE.test(n.trim()))setUser(n,rd("t12_uid")||undefined)}
applyTheme();
render();
</script></body></html>
