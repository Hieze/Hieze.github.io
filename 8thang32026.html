<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chúc mừng ngày 8 tháng 3</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.9);
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 600px;
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      color: #ff4d6d;
      font-size: 40px;
      margin-bottom: 10px;
    }

    h2 {
      color: #333;
      font-weight: 500;
    }

    p {
      font-size: 18px;
      color: #444;
      line-height: 1.6;
      margin-top: 20px;
    }

    .heart {
      font-size: 40px;
      animation: heartbeat 1.2s infinite;
      display: inline-block;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.2); }
      40% { transform: scale(1); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .flowers {
      position: absolute;
      font-size: 24px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      from { transform: translateY(-10vh); }
      to { transform: translateY(110vh); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌸 Chúc mừng 8/3 🌸</h1>
    <h2>Dành cho youu </h2>

    <p>
      Chúc bà luôn xinh đẹp, vui vẻ và hạnh phúc mỗi ngày. 
      Mong rằng mọi điều tốt đẹp nhất sẽ đến với bà hôm nay và mãi về sau :}.
    </p>

    <p>
      Chúc bà có một ngày <b>Quốc tế Phụ nữ 8/3</b> thật ý nghĩa!
    </p>

    <div class="heart">❤️</div>
  </div>

  <script>
    function createFlower() {
      const flower = document.createElement('div');
      flower.classList.add('flowers');
      flower.innerHTML = '🌸';

      flower.style.left = Math.random() * window.innerWidth + 'px';
      flower.style.animationDuration = (3 + Math.random() * 5) + 's';
      flower.style.opacity = Math.random();

      document.body.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, 8000);
    }

    setInterval(createFlower, 300);
  
    // Hearts floating
    function createHeart() {
      const heart = document.createElement('div');
      heart.innerHTML = '❤️';
      heart.style.position = 'fixed';
      heart.style.bottom = '-20px';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.fontSize = (16 + Math.random()*24) + 'px';
      heart.style.opacity = Math.random();
      heart.style.transition = 'transform 4s linear, opacity 4s linear';
      document.body.appendChild(heart);

      setTimeout(()=>{
        heart.style.transform = 'translateY(-110vh)';
        heart.style.opacity = 0;
      },50);

      setTimeout(()=>heart.remove(),4000);
    }

    setInterval(createHeart, 500);

    // Simple fireworks
    function createFirework(x,y){
      const colors=['#ff4d6d','#ffd166','#06d6a0','#118ab2','#f72585','#f77f00'];
      for(let i=0;i<20;i++){
        const p=document.createElement('div');
        const size=6+Math.random()*6;
        p.style.position='fixed';
        p.style.left=x+'px';
        p.style.top=y+'px';
        p.style.width=size+'px';
        p.style.height=size+'px';
        p.style.borderRadius='50%';
        p.style.background=colors[Math.floor(Math.random()*colors.length)];
        p.style.pointerEvents='none';
        document.body.appendChild(p);

        const angle=Math.random()*2*Math.PI;
        const dist=80+Math.random()*120;
        const dx=Math.cos(angle)*dist;
        const dy=Math.sin(angle)*dist;

        p.animate([
          {transform:'translate(0,0)',opacity:1},
          {transform:`translate(${dx}px,${dy}px)`,opacity:0}
        ],{duration:1000+Math.random()*600,easing:'ease-out'});

        setTimeout(()=>p.remove(),1600);
      }
    }

    document.addEventListener('click',(e)=>{
      createFirework(e.clientX,e.clientY);
    });

  </script>

</body>
</html>
